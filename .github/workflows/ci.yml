name: ci

# Two jobs, and they answer two different questions:
#   test  — does the code work?      (pytest, no network, no key)
#   build — does the Dockerfile work? (a real docker build, which is the only
#           way to know, since a Dockerfile nobody has built is a guess)
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests (offline, no API key)
        run: python -m pytest tests/ -q

      # Catches the exact failure that killed this project before: a model id
      # pinned in code that the provider has since retired.
      - name: Guard against retired model ids in code values
        run: python -m pytest tests/ -q -k retired

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mfa:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image starts and the app answers, not merely that it built.
      - name: Start it and check the health endpoint
        run: |
          docker run -d --name mfa -p 8501:8501 mfa:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              echo "healthy after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "--- container logs ---"
          docker logs mfa
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs mfa || true

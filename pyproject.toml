[project]
name = "multimodal-financial-assistant"
version = "0.5.0"
description = "A local financial document OCR and semantic retrieval demo."
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<12",
  "numpy>=1.26,<3",
  "chromadb>=1,<2",
  "sentence-transformers>=3,<6",
  "rapidocr-onnxruntime>=1.4,<2",
  "streamlit>=1.38,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

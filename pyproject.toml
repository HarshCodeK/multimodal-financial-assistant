[project]
name = "multimodal-financial-assistant"
version = "0.4.0"
description = "A local Streamlit financial assistant with PDF RAG, Groq answers, and image analysis."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<12",
  "chromadb>=1,<2",
  "sentence-transformers>=3,<6",
  "streamlit>=1.38,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

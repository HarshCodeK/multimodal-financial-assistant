[project]
name = "multimodal-financial-assistant"
version = "0.2.0"
description = "A grounded financial-policy assistant with document and image inputs."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "requests>=2.32,<3",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<12",
  "chromadb>=1,<2",
  "sentence-transformers>=3,<6",
  "streamlit>=1.38,<2",
  "python-multipart>=0.0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

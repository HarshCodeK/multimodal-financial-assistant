[project]
name = "multimodal-financial-assistant"
version = "0.7.0"
description = "An explainable PDF RAG and image question-answering demo."
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "numpy>=1.26,<3",
  "chromadb>=1,<2",
  "sentence-transformers>=3,<6",
  "streamlit>=1.38,<2",
  "groq>=0.11,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
